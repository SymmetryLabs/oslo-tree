# The Oslo tree's website (apps/oslo-site): the looks a visitor can choose,
# in the order the page shows them. Each shows the tree's form: its
# trunk-to-twig hierarchy, its single leaves, or its volume in space, with
# a per-leaf texture multiplied over it (Colour channel) and a light accent
# added on top (Structure channel). The page goes to scene k of both
# channels together, over the channel's transition. Starlings comes first:
# the page opens on it, at night. Frost, white with pink on the outer
# leaves, is the look of the photographs of the tree at Trettenparken. No channel cycles by itself: the visitor (or, later, a
# public vote) chooses. Every look, drawn in its setting: cargo run
# --release -p li-oslo-site --example oslo_render -- --look 0,1,2,3,4,5,6,7,8

format = 2

[[channel]]
name = "Colour"
transition = 5.0

[[channel.scene]]
name = "Starlings"
id = 1000015
[channel.scene.palette]
